name: Release

# Builds the optimised (R8) release APKs for arm64-v8a, armeabi-v7a and x86_64 plus a universal one, signs them, and attaches
# them with checksums to a GitHub release. Triggered by a tag such as v1.2.0, or by hand from the Actions tab.
#
# Signing: put your key into the repository secrets (see tools/make-release-keystore.sh):
#   FELDKIT_KEYSTORE_BASE64, FELDKIT_KEYSTORE_PASSWORD, FELDKIT_KEY_ALIAS, FELDKIT_KEY_PASSWORD
# Without them the build still runs and signs with a throwaway key; such a release is marked as a pre-release because phones will
# refuse to update an app installed from a build signed with a different key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.2.0 (the release is created only for tags)'
        required: false
        default: '0.0.0-manual'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "build-tools;37.0.0" >/dev/null
          sdkmanager "platforms;android-37.0" >/dev/null || true    # otherwise the Android Gradle plugin downloads the platform itself

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="${{ github.event.inputs.version }}"; fi
          V="${V:-0.0.0-manual}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $V (versionCode $CODE)"

      - name: Signing key
        id: key
        env:
          B64: ${{ secrets.FELDKIT_KEYSTORE_BASE64 }}
          SECRET_PW: ${{ secrets.FELDKIT_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.FELDKIT_KEY_ALIAS }}
          SECRET_KEYPW: ${{ secrets.FELDKIT_KEY_PASSWORD }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FELDKIT_KEYSTORE_PASSWORD=$SECRET_PW" >> "$GITHUB_ENV"
            echo "FELDKIT_KEY_ALIAS=$SECRET_ALIAS" >> "$GITHUB_ENV"
            echo "FELDKIT_KEY_PASSWORD=${SECRET_KEYPW:-$SECRET_PW}" >> "$GITHUB_ENV"
            echo "own=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets found: signing with a throwaway key (the release will be marked as a pre-release)."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -keypass "$PW" -alias throwaway \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=FeldKit throwaway build key" >/dev/null
            echo "FELDKIT_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"; echo "FELDKIT_KEY_ALIAS=throwaway" >> "$GITHUB_ENV"; echo "FELDKIT_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "own=false" >> "$GITHUB_OUTPUT"
          fi
          echo "FELDKIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease -PallAbis -PversionName="${{ steps.v.outputs.name }}" -PversionCode="${{ steps.v.outputs.code }}" --no-daemon

      - name: Name, verify and checksum
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/FeldKit-${{ steps.v.outputs.name }}-$abi.apk"
          done
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/*arm64-v8a.apk | head -3
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # R8 mapping file: needed to read crash reports
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.v.outputs.name }}.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: FeldKit-${{ steps.v.outputs.name }}
          path: dist/*

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.key.outputs.own != 'true' }}
          generate_release_notes: true
          body: |
            **Which file?** Almost every phone from the last years: `arm64-v8a`. Older 32-bit phones: `armeabi-v7a`. Emulators and some Chromebooks: `x86_64`. Unsure: the `universal` one (larger).
            Check the download against `SHA256SUMS.txt`. Open the APK on the phone and allow installing from your browser or file manager when asked.
            ${{ steps.key.outputs.own != 'true' && 'This build is signed with a throwaway key: install it for trying out, and uninstall it before installing a properly signed release.' || '' }}
